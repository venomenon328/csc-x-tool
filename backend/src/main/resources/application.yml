server:
  address: 127.0.0.1

csc-x-tool:
  desktop:
    enabled: false
    suppress-browser: false
  security:
    csrf-enabled: true

spring:
  application:
    name: csc-x-tool
  liquibase:
    enabled: false
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: false

logging:
  level:
    org.springframework: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 50MB
