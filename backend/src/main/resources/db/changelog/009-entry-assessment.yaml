databaseChangeLog:
  - changeSet:
      id: 009-entry-assessment
      author: venomenon328
      runInTransaction: false
      changes:
        - sql:
            sql: |-
              -- SQLite needs a table rebuild to replace the legacy listening flags with the
              -- paired assessment fields and retain their database-owned invariant.
              PRAGMA foreign_keys = OFF;

              CREATE TABLE contest_entry_new (
                id INTEGER PRIMARY KEY,
                motto_show_id INTEGER NOT NULL,
                artist TEXT NOT NULL
                  CONSTRAINT ck_contest_entry_artist_not_blank CHECK (length(trim(artist)) > 0),
                title TEXT NOT NULL
                  CONSTRAINT ck_contest_entry_title_not_blank CHECK (length(trim(title)) > 0),
                youtube_url TEXT NOT NULL
                  CONSTRAINT ck_contest_entry_youtube_url_not_blank CHECK (length(trim(youtube_url)) > 0),
                comment TEXT,
                assessment INTEGER,
                assessment_confidence INTEGER,
                pool_position INTEGER NOT NULL
                  CONSTRAINT ck_contest_entry_pool_position_positive CHECK (pool_position > 0),
                ranking_position INTEGER
                  CONSTRAINT ck_contest_entry_ranking_position_positive CHECK (ranking_position IS NULL OR ranking_position > 0),
                participant_id INTEGER,
                created_at TEXT NOT NULL,
                updated_at TEXT NOT NULL,
                CONSTRAINT ck_contest_entry_assessment_pair CHECK (
                  (assessment IS NULL AND assessment_confidence IS NULL)
                  OR (
                    assessment IS NOT NULL
                    AND assessment_confidence IS NOT NULL
                    AND assessment BETWEEN 1 AND 5
                    AND assessment_confidence BETWEEN 1 AND 5
                  )
                ),
                CONSTRAINT fk_contest_entry_motto_show
                  FOREIGN KEY (motto_show_id) REFERENCES motto_show (id) ON DELETE RESTRICT,
                CONSTRAINT fk_contest_entry_participant
                  FOREIGN KEY (participant_id) REFERENCES participant (id) ON DELETE RESTRICT,
                CONSTRAINT uq_contest_entry_motto_show_pool_position UNIQUE (motto_show_id, pool_position),
                CONSTRAINT uq_contest_entry_motto_show_ranking_position UNIQUE (motto_show_id, ranking_position)
              );

              INSERT INTO contest_entry_new (
                id, motto_show_id, artist, title, youtube_url, comment, assessment, assessment_confidence,
                pool_position, ranking_position, participant_id, created_at, updated_at
              )
              SELECT id, motto_show_id, artist, title, youtube_url, comment,
                     CASE WHEN listened = 1 THEN 3 ELSE NULL END,
                     CASE
                       WHEN listened = 0 THEN NULL
                       WHEN relisten = 1 THEN 1
                       ELSE 2
                     END,
                     pool_position, ranking_position, participant_id, created_at, updated_at
              FROM contest_entry;

              DROP TABLE contest_entry;
              ALTER TABLE contest_entry_new RENAME TO contest_entry;

              CREATE INDEX ix_contest_entry_motto_show ON contest_entry (motto_show_id);
              CREATE INDEX ix_contest_entry_participant ON contest_entry (participant_id);
              CREATE UNIQUE INDEX ux_contest_entry_show_participant
                ON contest_entry (motto_show_id, participant_id) WHERE participant_id IS NOT NULL;

              PRAGMA foreign_key_check;
              PRAGMA foreign_keys = ON;
